# Configuration Codecov — couverture par section.
#
# Les flags `app-unit-tests` et `backend-unit-tests` deviennent pleinement
# actifs en Phase 1, quand le dépôt est découpé en sous-projets `app/` et
# `backend/` avec leurs workflows Vitest respectifs. Tant que le backend n'est
# pas extrait, seul `app-unit-tests` remonte de la couverture.

coverage:
  status:
    project:
      default:
        flags:
          - app-unit-tests
          - backend-unit-tests
        threshold: 0.5%
    patch:
      default:
        flags:
          - app-unit-tests
          - backend-unit-tests
        target: 50%
        threshold: 10%

github_checks:
  annotations: true

flags:
  app-unit-tests:
    carryforward: true
    paths:
      - app
  backend-unit-tests:
    carryforward: true
    paths:
      - backend
