# Une plateforme peut terminer TLS avant nginx. Le protocole d'origine doit
# être conservé pour que les redirections OAuth restent en HTTPS ; en local,
# nginx transmet simplement son propre protocole HTTP.
map $http_x_forwarded_proto $worktogo_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Les routes Nuxt générées dans des dossiers (`/auth` → `/auth/`) déclenchent
  # une redirection automatique. La rendre relative conserve l'hôte et le port
  # d'origine (notamment `localhost:3100` après un callback OAuth).
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  # Nuxt génère un petit script inline qui initialise `window.__NUXT__` avant
  # le chargement du bundle. Le bloquer laisse l'application sans configuration
  # d'exécution et produit une page blanche.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https:; font-src 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    # `$host` retire le port. Google doit retrouver l'origine publique exacte
    # (par exemple http://localhost:3100) dans son `redirect_uri`.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $worktogo_forwarded_proto;
  }

  location = /health {
    proxy_pass http://api:3001/health;
  }

  location = /health/db {
    proxy_pass http://api:3001/health/db;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
