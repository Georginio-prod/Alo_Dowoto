name: Frontend CI

# CI du front Nuxt (app/, server/, i18n/…). Le backend Express a sa propre CI
# (.github/workflows/backend-ci.yml). Ce workflow vérifie : dépendances, lint
# (ESLint strict + règle des 300 lignes), lint Markdown (markdownlint-cli2),
# typage TypeScript (nuxt typecheck / vue-tsc), génération du client Prisma,
# tests unitaires (Vitest) et build de production.
# Il tourne sur CHAQUE Pull Request (quelle que soit la branche de base, ce qui
# couvre les PR empilées) et à chaque push sur develop/master.
#
# Le déploiement (#47) est géré séparément par .github/workflows/deploy.yml,
# déclenché uniquement après le succès de CE workflow sur develop/master
# (voir docs/deployment.md).

on:
  pull_request:
  push:
    branches: [develop, master]

# Annule les exécutions précédentes encore en cours sur la même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # NB : ce nom de job est le CONTEXTE de statut requis par le ruleset
    # « Protéger develop » (check `Lint · Typecheck · Build`). Ne pas le suffixer
    # (le workflow s'appelle déjà « Frontend CI », le backend a son propre job
    # `Lint · Typecheck · Test · Build (backend)`) : le renommer casserait la
    # barrière de merge sur develop.
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worktogo
          POSTGRES_PASSWORD: worktogo
          POSTGRES_DB: worktogo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worktogo" --health-interval 5s
          --health-timeout 5s --health-retries 15
    env:
      # Base PostgreSQL fournie par le service ci-dessus. `prisma generate` ne
      # s'y connecte pas ; les tests unitaires utilisent TEST_DATABASE_URL (voir
      # tests/setup/prismaTestDb.ts + vitest.config.ts). Voir docs/deployment.md.
      DATABASE_URL: 'postgresql://worktogo:worktogo@localhost:5432/worktogo_test'
      TEST_DATABASE_URL: 'postgresql://worktogo:worktogo@localhost:5432/worktogo_test'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint Markdown (markdownlint-cli2)
        run: npm run lint:md

      - name: Générer le client Prisma
        run: npm run db:generate

      - name: Typecheck (nuxt typecheck)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm run test

      - name: Build (nuxt build)
        run: npm run build
