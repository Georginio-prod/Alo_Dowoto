name: Tests de parcours (Playwright)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worktogo
          POSTGRES_PASSWORD: worktogo
          POSTGRES_DB: worktogo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worktogo" --health-interval 5s
          --health-timeout 5s --health-retries 15
    env:
      # Base PostgreSQL fournie par le service ci-dessus. `prisma generate` ne
      # s'y connecte pas ; la base jetable des tests est gérée par
      # playwright.config.ts (globalSetup + webServer), via E2E_DATABASE_URL.
      DATABASE_URL: 'postgresql://worktogo:worktogo@localhost:5432/worktogo_e2e'
      E2E_DATABASE_URL: 'postgresql://worktogo:worktogo@localhost:5432/worktogo_e2e'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      # Le client Prisma doit correspondre au schéma : sans ça, l'instance Nuxt
      # démarrée par Playwright échoue dès qu'une route touche aux modèles
      # ajoutés récemment. Le schéma appartient au backend (`backend/prisma/`,
      # ADR-0017) : on génère via le script racine qui délègue au workspace
      # (client mutualisé/hoisté, importable par l'app), comme le fait ci.yml.
      - name: Générer le client Prisma
        run: npm run db:generate
      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium
      # La base SQLite jetable et le serveur Nuxt sont pris en charge par
      # playwright.config.ts (globalSetup + webServer).
      - name: Lancer les tests de parcours
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
