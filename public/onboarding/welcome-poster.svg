<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a22"/>
      <stop offset="0.42" stop-color="#152018"/>
      <stop offset="1" stop-color="#0b0f0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.24" r="0.6">
      <stop offset="0" stop-color="#14A800" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14A800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.78" cy="0.16" r="0.35">
      <stop offset="0" stop-color="#E6A700" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E6A700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Ciel de fin de journée -->
  <rect width="720" height="1280" fill="url(#sky)"/>
  <rect width="720" height="1280" fill="url(#sun)"/>
  <rect width="720" height="1280" fill="url(#glow)"/>

  <!-- Silhouette d'un quartier ouest-africain : toits en tôle, poteaux -->
  <g fill="#0d140f" opacity="0.9">
    <rect x="0" y="720" width="150" height="200"/>
    <rect x="150" y="676" width="120" height="244"/>
    <rect x="270" y="742" width="96" height="178"/>
    <rect x="366" y="700" width="150" height="220"/>
    <rect x="516" y="748" width="110" height="172"/>
    <rect x="626" y="712" width="94" height="208"/>
    <!-- Débords de toits en tôle -->
    <polygon points="0,720 150,720 168,704 -18,704"/>
    <polygon points="150,676 270,676 288,660 132,660"/>
    <polygon points="366,700 516,700 534,684 348,684"/>
  </g>

  <!-- Ligne électrique + poteau, détail de rue -->
  <g stroke="#0a0d0a" stroke-width="4" opacity="0.7">
    <line x1="60" y1="640" x2="700" y2="700"/>
    <line x1="60" y1="662" x2="700" y2="726"/>
  </g>
  <rect x="52" y="600" width="8" height="150" fill="#0a0d0a" opacity="0.8"/>

  <!-- Voile bas : la zone où viendront titre, sous-titre et boutons -->
  <rect x="0" y="560" width="720" height="720" fill="url(#floor)"/>

  <!-- Point de marque discret -->
  <circle cx="360" cy="360" r="3" fill="#14A800" opacity="0.5"/>
</svg>
