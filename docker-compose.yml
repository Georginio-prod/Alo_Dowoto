name: worktogo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worktogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worktogo}
      POSTGRES_DB: ${POSTGRES_DB:-worktogo}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - worktogo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://worktogo:worktogo@postgres:5432/worktogo?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://worktogo:worktogo@postgres:5432/worktogo?schema=public}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - '3001'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - '${WEB_PORT:-3000}:80'
    restart: unless-stopped

  adminer:
    image: adminer:4
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  worktogo-pg-data:
